name: Code scanning

# The README's "In CI" example, verbatim between the markers below
# (test/readme-ci.test.ts fails if they drift apart). It scans this repository
# with the published package, so it runs after a successful release and on
# demand, and it needs code scanning enabled (a public repository).

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  agentsapper:
    name: agentsapper (published package)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # README snippet begins
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own step, so a failed install fails the job instead of passing as exit 1.
      - name: Install agentsapper
        # From outside the checkout, so its .npmrc cannot redirect the install.
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts agentsapper@0.1.0
      - name: Scan with agentsapper
        run: |
          status=0
          agentsapper . --format sarif > agentsapper.sarif || status=$?
          # 1 = findings, reported through code scanning; 2 = error or incomplete scan
          if [ "$status" -ge 2 ]; then exit "$status"; fi
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: agentsapper.sarif
    # README snippet ends
