name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run selfscan
      - run: npm run demo

  # The dev toolchain needs Node 22+, but the published CLI promises Node 20+.
  # Build on a current Node, pack it, then run the packed CLI on the oldest
  # supported Node through npx, the way users will run it.
  runtime-node20:
    name: Packed CLI smoke test (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node --version
      - name: Run the packed CLI through npm exec (what npx does)
        run: |
          cd "$RUNNER_TEMP"
          PKG=$(ls "$GITHUB_WORKSPACE"/agentsapper-*.tgz)
          npm exec --yes --package="$PKG" -- agentsapper --version
          npm exec --yes --package="$PKG" -- agentsapper "$GITHUB_WORKSPACE"
          npm exec --yes --package="$PKG" -- agentsapper "$GITHUB_WORKSPACE" --format sarif > results.sarif
          test -s results.sarif
