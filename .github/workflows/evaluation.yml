name: Evaluation

# Reproduces docs/evaluation/RESULTS.md on Linux: fixture detection plus a scan of
# the benign corpus (shallow clones of popular repositories) for false positives.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Fixture and benign corpus evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run corpus:fetch -- "$RUNNER_TEMP/corpus"
      - run: npm run eval
        env:
          AGENTSAPPER_CORPUS: ${{ runner.temp }}/corpus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation
          path: docs/evaluation/
          if-no-files-found: error
